<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="An installable Subbuteo scoreboard that works offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scoreboard">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'">
  <title>Subbuteo Scoreboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="scoreboard-v4.css">
</head>
<body>
  <main class="scoreboard" aria-label="Subbuteo scoreboard">
    <header class="topbar">
      <input class="league-input" id="leagueTitle" type="text" value="SUBBUTEO LEAGUE" maxlength="30"
        aria-label="League name" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <time class="clock" id="clock" aria-label="Current time">00:00:00</time>
    </header>

    <section class="match-time" aria-label="Match timer">
      <span>MATCH TIME</span>
      <div class="time-input" aria-label="Match time">
        <input id="timerMinutes" type="text" value="15" inputmode="numeric" pattern="[0-9]*" maxlength="3"
          aria-label="Minutes" autocomplete="off" spellcheck="false">
        <span aria-hidden="true">:</span>
        <input id="timerSeconds" type="text" value="00" inputmode="numeric" pattern="[0-9]*" maxlength="2"
          aria-label="Seconds" autocomplete="off" spellcheck="false">
      </div>
    </section>

    <section class="teams" aria-label="Teams and score">
      <article class="team-card">
        <input id="teamAName" class="team-name" type="text" value="HOME TEAM" maxlength="15"
          aria-label="Home team name" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <output id="scoreA" class="score" aria-live="polite" aria-label="Home team score">0</output>
        <div class="score-controls">
          <button type="button" data-score-team="A" data-score-change="-1" aria-label="Decrease home score">&minus;</button>
          <button type="button" data-score-team="A" data-score-change="1" aria-label="Increase home score">+</button>
        </div>
      </article>

      <article class="team-card">
        <input id="teamBName" class="team-name" type="text" value="AWAY TEAM" maxlength="15"
          aria-label="Away team name" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <output id="scoreB" class="score" aria-live="polite" aria-label="Away team score">0</output>
        <div class="score-controls">
          <button type="button" data-score-team="B" data-score-change="-1" aria-label="Decrease away score">&minus;</button>
          <button type="button" data-score-team="B" data-score-change="1" aria-label="Increase away score">+</button>
        </div>
      </article>
    </section>

    <nav class="controls" aria-label="Match controls">
      <button id="startButton" type="button">Start</button>
      <button id="pauseButton" type="button">Pause</button>
      <button id="resetTimerButton" type="button">Reset time</button>
      <button id="crowdButton" type="button" aria-pressed="false">Crowd off</button>
      <button id="resetScoresButton" type="button">Reset score</button>
      <button id="fullscreenButton" type="button">Fullscreen</button>
      <button id="installButton" class="install-button" type="button" hidden>Install app</button>
    </nav>
  </main>

  <p class="rotate-hint" role="status">For the clearest scoreboard, rotate your device to landscape.</p>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <audio id="whistleSound" src="referee-blowing-whistle-sound-effect.mp3" preload="auto"></audio>
  <audio id="cheerSound" src="Big-crowd-cheering.mp3" preload="auto"></audio>
  <audio id="crowdLoopSound" src="freesound_community-soccer-stadium-10-6709.mp3" preload="auto" loop></audio>
  <noscript>This scoreboard needs JavaScript enabled.</noscript>
  <script src="scoreboard-v4.js" defer></script>
</body>
</html>
